[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-trading-system"
version = "0.1.0"
description = "BTC quantitative research platform (research first, bot later)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "pyarrow>=15",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.8", "ruff>=0.4"]
# Läggs till först i respektive fas (se docs/DEPENDENCIES.md):
research = ["scipy>=1.11", "statsmodels>=0.14", "scikit-learn>=1.4", "matplotlib>=3.8"]
ml = ["xgboost>=2.0", "shap>=0.44"]
live = ["ccxt>=4.2"]
dashboard = ["streamlit>=1.32"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
[tool.setuptools.packages.find]
include = ["btc_trading_system*"]
