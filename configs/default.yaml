market:
  symbol: BTCUSDT
  venue: binance
  instrument: spot        # spot | perp  (futures med förfall: ej stött ännu)
timeframe:
  primary: 15m
risk:
  risk_per_trade: 0.005
  max_leverage: 1.0
  max_daily_loss: 0.02
  max_drawdown: 0.20
execution:
  slippage_model: fixed
  slippage_bps: 5.0
  taker_fee_bps: 5.0
  maker_fee_bps: 2.0
  min_latency_bars: 1     # order kan tidigast fyllas 1 bar efter signal
trading:
  live: false
  paper: false
data_split:
  # Exklusiva gränser i UTC, [start, end) på open_time; en bar hör till den del där open_time ligger.
  # Minst 7 dagars lucka mellan delarna. FINAL TEST får ej röras vid optimering.
  # LÅST (D-B-h, P1-05): ändras aldrig efter att data setts; FINAL TEST används en gång.
  train: {start: "2020-01-01T00:00:00Z", end: "2024-01-01T00:00:00Z"}
  validation: {start: "2024-01-08T00:00:00Z", end: "2025-07-01T00:00:00Z"}
  final_test: {start: "2025-07-08T00:00:00Z", end: "2026-10-01T00:00:00Z"}
